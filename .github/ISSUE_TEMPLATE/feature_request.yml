name: Feature request
description: Suggest an idea for Overlid
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what's missing, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This doesn't need telemetry, a keyboard hook, or sending my data anywhere new.
