<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expanded island, Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A1A1A6}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 840px; height: 440px; background: #2E3138; overflow: hidden; font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; top: 0; left: 80px; width: 680px; height: 362px; box-sizing: border-box; padding: 12px 16px 16px; background: #000000; border-radius: 0 0 32px 32px; display: flex; flex-direction: column; gap: 14px">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" style="position: absolute; top: 0; left: -18px"><path d="M0 0 H18 V18 A18 18 0 0 0 0 0 Z" fill="#000000"></path></svg>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" style="position: absolute; top: 0; right: -18px"><path d="M18 0 H0 V18 A18 18 0 0 1 18 0 Z" fill="#000000"></path></svg>

    <nav aria-label="Island panels" style="display: flex; align-items: center; gap: 4px">
      <button aria-current="page" style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 12.5px; font-weight: 500">Home</button>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12.5px; font-weight: 500">Media</button>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12.5px; font-weight: 500">Code</button>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12.5px; font-weight: 500">Prompter</button>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12.5px; font-weight: 500">Focus</button>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12.5px; font-weight: 500">Stats</button>
      <div style="flex-grow: 1"></div>
      <span style="color: #FFFFFF; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; padding-right: 6px">14:32</span>
      <button aria-label="Settings" style="width: 30px; height: 30px; border: 0; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </nav>

    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

      <div style="background: #111113; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
        <span style="color: #8A8A8F; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">Now playing</span>
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 10px; background: {{accent}}; box-shadow: 0 6px 20px {{accentGlow}}"></div>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="color: #FFFFFF; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Track title]</span>
            <span style="color: #A1A1A6; font-size: 12px">[Artist] · Spotify</span>
          </div>
          <button aria-label="Pause" style="width: 36px; height: 36px; flex-shrink: 0; border: 0; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#000000"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
          </button>
        </div>
      </div>

      <div style="background: #111113; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
        <span style="color: #8A8A8F; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">Focus</span>
        <div style="display: flex; align-items: center; gap: 12px">
          <svg aria-hidden="true" width="48" height="48" viewBox="0 0 48 48" style="transform: rotate(-90deg); flex-shrink: 0"><circle cx="24" cy="24" r="20" fill="none" stroke="#2A2A2D" stroke-width="4"></circle><circle cx="24" cy="24" r="20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="125.7" stroke-dashoffset="31.4"></circle></svg>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="color: #FFFFFF; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">18:42</span>
            <span style="color: #A1A1A6; font-size: 12px">Round 2 of 4</span>
          </div>
          <button style="height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600">Pause</button>
        </div>
      </div>

      <div style="background: #111113; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="color: #8A8A8F; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">Claude Code</span>
          <span style="color: #FFB224; font-size: 12px; font-weight: 600">1 waiting</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 5px">
            <div style="display: flex; justify-content: space-between"><span style="color: #FFFFFF; font-size: 12px">5-hour</span><span style="color: #FFFFFF; font-size: 12px; font-variant-numeric: tabular-nums">42%</span></div>
            <div style="height: 5px; border-radius: 3px; background: #2A2A2D"><div style="width: 42%; height: 100%; border-radius: 3px; background: #FFFFFF"></div></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 5px">
            <div style="display: flex; justify-content: space-between"><span style="color: #FFFFFF; font-size: 12px">7-day</span><span style="color: #FFFFFF; font-size: 12px; font-variant-numeric: tabular-nums">63%</span></div>
            <div style="height: 5px; border-radius: 3px; background: #2A2A2D"><div style="width: 63%; height: 100%; border-radius: 3px; background: #FFFFFF"></div></div>
          </div>
        </div>
      </div>

      <div style="background: #111113; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <span style="color: #8A8A8F; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">System</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="color: #FFFFFF; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">23%</span>
            <span style="color: #A1A1A6; font-size: 12px">CPU</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="color: #FFFFFF; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">61%</span>
            <span style="color: #A1A1A6; font-size: 12px">RAM</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="color: #3DD68C; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">64%</span>
            <span style="color: #A1A1A6; font-size: 12px">Battery</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8743B","options":["#E8743B","#4F8CFF","#3DD68C","#D45BD9"]},"$preview":{"width":840,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#E8743B';
    return { accent, accentGlow: accent + '59' };
  }
}
</script>
</body>
</html>
