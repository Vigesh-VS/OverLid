<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expanded island, Stats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A1A1A6}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 840px; height: 440px; background: #2E3138; overflow: hidden; font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; top: 0; left: 80px; width: 680px; height: 330px; box-sizing: border-box; padding: 12px 16px 16px; background: #000000; border-radius: 0 0 32px 32px; display: flex; flex-direction: column; gap: 14px">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" style="position: absolute; top: 0; left: -18px"><path d="M0 0 H18 V18 A18 18 0 0 0 0 0 Z" fill="#000000"></path></svg>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" style="position: absolute; top: 0; right: -18px"><path d="M18 0 H0 V18 A18 18 0 0 1 18 0 Z" fill="#000000"></path></svg>

    <nav aria-label="Island panels" style="display: flex; align-items: center; gap: 4px">
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12.5px; font-weight: 500">Home</button>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12.5px; font-weight: 500">Media</button>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12.5px; font-weight: 500">Code</button>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12.5px; font-weight: 500">Prompter</button>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12.5px; font-weight: 500">Focus</button>
      <button aria-current="page" style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 12.5px; font-weight: 500">Stats</button>
      <div style="flex-grow: 1"></div>
      <span style="color: #FFFFFF; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; padding-right: 6px">14:32</span>
      <button aria-label="Settings" style="width: 30px; height: 30px; border: 0; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </nav>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="background: #111113; border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="position: relative; width: 96px; height: 96px">
          <svg aria-hidden="true" width="96" height="96" viewBox="0 0 96 96" style="transform: rotate(-90deg)"><circle cx="48" cy="48" r="40" fill="none" stroke="#2A2A2D" stroke-width="8"></circle><circle cx="48" cy="48" r="40" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="193.5"></circle></svg>
          <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums">23%</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span style="color: #FFFFFF; font-size: 13px; font-weight: 600">CPU</span>
          <span style="color: #A1A1A6; font-size: 11px">8 cores</span>
        </div>
      </div>
      <div style="background: #111113; border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="position: relative; width: 96px; height: 96px">
          <svg aria-hidden="true" width="96" height="96" viewBox="0 0 96 96" style="transform: rotate(-90deg)"><circle cx="48" cy="48" r="40" fill="none" stroke="#2A2A2D" stroke-width="8"></circle><circle cx="48" cy="48" r="40" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="98"></circle></svg>
          <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums">61%</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span style="color: #FFFFFF; font-size: 13px; font-weight: 600">Memory</span>
          <span style="color: #A1A1A6; font-size: 11px; font-variant-numeric: tabular-nums">9.8 / 16 GB</span>
        </div>
      </div>
      <div style="background: #111113; border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="position: relative; width: 96px; height: 96px">
          <svg aria-hidden="true" width="96" height="96" viewBox="0 0 96 96" style="transform: rotate(-90deg)"><circle cx="48" cy="48" r="40" fill="none" stroke="#2A2A2D" stroke-width="8"></circle><circle cx="48" cy="48" r="40" fill="none" stroke="#3DD68C" stroke-width="8" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="90.5"></circle></svg>
          <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #3DD68C; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums">64%</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span style="color: #FFFFFF; font-size: 13px; font-weight: 600">Battery</span>
          <span style="color: #A1A1A6; font-size: 11px">Charging · 48m to full</span>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex-grow: 1; background: #111113; border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between">
        <span style="color: #A1A1A6; font-size: 12px">Uptime</span>
        <span style="color: #FFFFFF; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">3d 4h</span>
      </div>
      <div style="flex-grow: 1; background: #111113; border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between">
        <span style="color: #A1A1A6; font-size: 12px">Disk C: free</span>
        <span style="color: #FFFFFF; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">212 GB</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":840,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
