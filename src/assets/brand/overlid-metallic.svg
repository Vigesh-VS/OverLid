<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Overlid</title><desc id="desc">A notched display arch above a rounded dynamic island containing a waveform, text lines and a status dot.</desc>
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="0.85" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".32" stop-color="#e9e9e9"/>
    <stop offset=".68" stop-color="#9b9b9b"/>
    <stop offset="1" stop-color="#f8f8f8"/>
  </linearGradient>
  <linearGradient id="metalLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a9a9a9"/>
    <stop offset=".22" stop-color="#ffffff"/>
    <stop offset=".72" stop-color="#ededed"/>
    <stop offset="1" stop-color="#858585"/>
  </linearGradient>
  <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#bcbcbc"/>
  </linearGradient>
</defs>
<!-- Upper display / notch silhouette -->
<path d="M190 492
 C190 378 282 286 396 286
 H450
 C468 286 478 296 488 310
 C496 321 506 326 520 326
 H576
 C590 326 600 321 608 310
 C618 296 628 286 646 286
 H700
 C814 286 906 378 906 492"
 fill="none" stroke="url(#metal)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Dynamic island capsule -->
<rect x="216" y="420" width="592" height="270" rx="135" fill="none" stroke="url(#metalLine)" stroke-width="22"/>
<!-- Voice / activity waveform -->
<g fill="url(#metal)">
  <rect x="304" y="542" width="16" height="38" rx="8"/>
  <rect x="334" y="516" width="17" height="90" rx="8.5"/>
  <rect x="367" y="492" width="18" height="138" rx="9"/>
  <rect x="402" y="516" width="17" height="90" rx="8.5"/>
  <rect x="434" y="542" width="16" height="38" rx="8"/>
</g>
<!-- Teleprompter text lines -->
<rect x="490" y="516" width="178" height="22" rx="11" fill="url(#metalLine)"/>
<rect x="490" y="574" width="126" height="22" rx="11" fill="url(#metalLine)"/>
<!-- Status / recording dot -->
<circle cx="730" cy="555" r="27" fill="url(#dot)"/>
</svg>