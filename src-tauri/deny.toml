# cargo-deny: run with `cargo deny --manifest-path src-tauri/Cargo.toml check`.

[graph]
# Overlid only ships for Windows; ignore other platforms' dependencies.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Every RustSec advisory fails the check unless listed here with a reason.
ignore = []

[licenses]
# Permissive licences compatible with shipping an MIT app.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The app itself isn't published, so its path dependencies are fine.
allow-wildcard-paths = true

[sources]
# Only crates.io; no git or other registries.
unknown-registry = "deny"
unknown-git = "deny"
